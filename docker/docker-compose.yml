# n8n + Task-Runner + Postgres + Caddy (automatisches HTTPS). Für einen Server in der EU.
# Start: .env aus .env.example anlegen, dann `docker compose up -d`.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.40.7}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY fehlt}
      N8N_HOST: ${N8N_DOMAIN:?N8N_DOMAIN fehlt}
      N8N_PROTOCOL: https
      N8N_WEBHOOK_URL: https://${N8N_DOMAIN}/
      # Editor only through an SSH tunnel on the server's loopback (http://localhost:5678), hence no secure cookie
      N8N_SECURE_COOKIE: "false"
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      # Datenschutz: Ausführungsdaten (enthalten Patientendaten) nur kurz aufbewahren.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 72
      # n8n first marks successful executions only "for deletion" (with request data!). Delete them for good right away:
      EXECUTIONS_DATA_HARD_DELETE_BUFFER: 0
      EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL: 1
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      # Code-Nodes laufen isoliert im separaten Runner-Container.
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN fehlt}
      N8N_RUNNERS_TASK_TIMEOUT: 60
    ports:
      - "127.0.0.1:5678:5678" # only locally on the server, for the SSH tunnel
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n:/import:ro

  runners:
    image: n8nio/runners:${N8N_VERSION:-2.40.7}
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      # Runner nie wegen Leerlauf beenden (Standard: nach 15 s). Der Neustart dauerte bis zu 46 s,
      # länger als Vapi auf ein Werkzeug wartet: Der Assistent hing dann in "Einen Moment ...".
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: 0

  # Mitarbeiter-Dashboard. Benutzer anlegen: docker compose run --rm dashboard node dashboard/benutzer.js anlegen <name>
  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      DASHBOARD_MODUS: live
      N8N_DASHBOARD_URL: http://n8n:5678/webhook/praxis-dashboard
      N8N_HEALTH_URL: http://n8n:5678/healthz
      N8N_DASHBOARD_TOKEN: ${DASHBOARD_API_TOKEN:?DASHBOARD_API_TOKEN fehlt}
      DASHBOARD_INTERN_TOKEN: ${DASHBOARD_INTERN_TOKEN:?DASHBOARD_INTERN_TOKEN fehlt}
      DASHBOARD_HTTPS: "1"
      DASHBOARD_HINTER_PROXY: "1"
      TZ: Europe/Berlin
    volumes:
      - dashboard_daten:/daten

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - n8n
      - dashboard
    ports:
      - "80:80"
      - "443:443"
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:?DASHBOARD_DOMAIN fehlt}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  dashboard_daten:
