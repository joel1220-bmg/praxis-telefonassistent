name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Die generierten Dateien müssen zum Quellcode passen (sonst wurde "npm run build" vergessen).
      - run: npm run build && git diff --exit-code -- n8n vapi/assistant.json
